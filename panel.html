  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("hodor-tema", t); } catch { /* sin almacenamiento */ }
}

function leerFinal(texto) {
  const b = [...String(texto || "").matchAll(/```json\s*(\{[\s\S]*?\})\s*```/g)];
  if (!b.length) return null;
  try { return JSON.parse(b[b.length - 1][1]); } catch { return null; }
}
function datosDe(x) { return (x.datos && x.datos.puntaje != null) ? x.datos : (leerFinal(x.final) || null); }

function grupoHu(h) {
  if (!h) return "sin";
  const e = (h.estado || "").toLowerCase();
  if (h.categoria === "done" || /produc|done|cerrad|terminad/.test(e)) return "produccion";
  if (/bloque/.test(e)) return "bloqueado";
  if (/pr staging/.test(e)) return "pr staging";
  if (/staging/.test(e)) return "staging";
  return "progreso";
}
function chipHu(h) {
  if (!h) return `<span class="chip c-off">sin Jira</span>`;
  const g = grupoHu(h); const cls = { produccion: "c-ok", bloqueado: "c-bad", "pr staging": "c-warn", staging: "c-acc", progreso: "c-off" }[g] || "c-off";
  return `<span class="chip ${cls}">${esc(h.estado)}${h.estado_desde ? ` · <span class="mono">${dura(h.estado_desde)}</span>` : ""}</span>`;
}

function progresoDe(an) {
  const p = ((S.datos || {}).progreso || {})[String(an && an.pr)];
  return p && an && String(p.fila) === String(an.id) ? p : null;
}

function segs(s) { s = Math.max(0, Math.round(Number(s) || 0)); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`; }

function pasosAnalisis(an, pedidoEn) {
  const prog = progresoDe(an);
  const arm = (an && an.armado) || {};
  const lista = arm.pasos || [];
  const ultimo = lista[lista.length - 1];
  const armadoListo = !!(prog || (an && (an.estado === "v3" || arm.fin)));
  const fase = prog ? prog.fase : "";
  const orden = ["bajando", "armando", "preparando", "analizando", "enviando", "listo"];
  const mal = fase === "error";
  const iWorker = orden.indexOf(mal ? prog.fase_previa : fase);
  const pasos = [];
  pasos.push({ t: "Pedido recibido", donde: "Hodor", estado: "hecho" });
  const armDet = !an ? "Revisa las puertas del PR" : armadoListo ? (lista.length ? `${lista.length} pasos en ${segs(lista.reduce((a, x) => a + (Number(x.s) || 0), 0))}` : "")
    : ultimo ? `${ultimo.t} · <span data-reloj="${esc(ultimo.en)}">${reloj(ultimo.en)}</span>` : "En la cola, esperando turno";
  pasos.push({ t: "Hodor prepara el pedido y las reglas", donde: "servidor de Hodor", estado: armadoListo ? "hecho" : "ahora", det: armDet, desde: !armadoListo && an ? (an.creado_en || pedidoEn) : 0 });
  const iAnaliza = orden.indexOf("analizando");
  const baja = !armadoListo ? "luego" : mal && iWorker < iAnaliza ? "mal" : iWorker >= iAnaliza ? "hecho" : "ahora";
  const accArmado = baja === "ahora" && prog ? (prog.eventos || []).slice(-5) : [];
  pasos.push({ t: "Tu worker arma el contexto", donde: "tu máquina", estado: baja,
    det: baja === "ahora" && !prog ? "El pedido está listo; tu worker lo toma en segundos" : baja === "ahora" ? "Trae el PR con tu git, revisa la huella y busca dónde se usa lo que cambia" : baja === "mal" ? esc(prog.error || "falló") : "",
    acciones: accArmado, desde: baja === "ahora" && prog ? prog.desde : 0 });
  let anaEstado = "luego", anaDet = "", acciones = [];
  if (prog && (fase === "analizando" || fase === "enviando")) {
    anaEstado = fase === "enviando" ? "hecho" : "ahora";
    anaDet = `${esc(prog.proveedor || "claude")}${prog.modelo ? ` · ${esc(prog.modelo)}` : ""} · paso ${Number(prog.pasos || 0)} de ${Number(prog.max || 0)}`;
    acciones = (prog.eventos || []).slice(-5);
  } else if (prog && fase === "listo") anaEstado = "hecho";
  else if (mal && iWorker >= iAnaliza) { anaEstado = "mal"; anaDet = esc(prog.error || "falló"); }
  pasos.push({ t: "Claude analiza", donde: "tu máquina", estado: anaEstado, det: anaDet, acciones, desde: anaEstado === "ahora" ? prog.desde : 0 });
  const listo = an && an.estado === "v3_analizado";
  pasos.push({ t: listo ? "Listo: ábrelo para ver los hallazgos" : "Resultado en tu panel", donde: "", estado: listo || fase === "listo" ? "hecho" : fase === "enviando" ? "ahora" : "luego",
    det: listo && datosDe(an) ? `Puntaje ${esc(datosDe(an).puntaje)}` : fase === "enviando" ? "Enviando el resultado a Hodor" : "" });
  return `<ol class="pasos-an">${pasos.map((x) => `<li class="${x.estado}">
      <span class="marca" aria-hidden="true">${x.estado === "hecho" ? I_PASO_OK : x.estado === "ahora" ? `<span class="giro"></span>` : x.estado === "mal" ? "!" : ""}</span>
      <span><span class="tit">${esc(x.t)}</span>${x.donde ? `<span class="donde">${esc(x.donde)}</span>` : ""}${x.det ? `<span class="det">${x.det}</span>` : ""}
        ${x.acciones && x.acciones.length ? `<span class="acciones">${x.acciones.map((e) => `<span class="mono">${esc(e.t)}</span>`).join("")}</span>` : ""}</span>
      <span class="tiempo mono">${x.desde ? `<span data-reloj="${esc(x.desde)}">${reloj(x.desde)}</span>` : ""}</span>
    </li>`).join("")}</ol>`;
}

function estadoPr(x) {
  const d = datosDe(x);
  if (x.estado === "pendiente" && !x.entregado) return ["En cola", "c-acc"];
  if ((x.estado === "corriendo" || x.estado === "v3") && !x.entregado) {
    const pr = progresoDe(x);
    if (pr && pr.fase === "analizando") return [`Claude analiza · paso ${Number(pr.pasos || 0)}`, "c-acc"];
    if (pr) return ["En tu worker", "c-acc"];
    return [x.estado === "v3" ? "Paquete listo · tu worker lo toma" : "Hodor arma el paquete", "c-acc"];
  }
  if (x.estado === "corriendo" || x.estado === "v3") return ["Analizando en tu worker", "c-acc"];
  if (x.estado === "v3_analizado") return d && Number(d.criticas || 0) ? ["Analizado · tiene críticas", "c-bad"] : d && (d.puntaje < 85 || Number(d.medias || 0) > 2) ? ["Analizado · bajo el umbral", "c-warn"] : ["Analizado · listo para enviar", "c-ok"];
  if (x.entregado && ["pendiente", "espera", "corriendo"].includes(x.estado)) return ["Enviado · " + (x.motivo || "pasando las reglas"), "c-warn"];
  if (x.estado === "v3_listo") return ["Enviado · Hodor lo procesa", "c-warn"];
  if (x.estado === "hecha") return x.accion === "aprobado" ? ["Enviado · aprobado", "c-ok"] : x.accion === "comentado" ? ["Enviado · con comentarios", "c-nar"] : ["Enviado · " + (x.accion || "procesado"), "c-info"];
  if (x.estado === "superada") return ["Cambió el commit · analiza de nuevo", "c-warn"];
  if (x.estado === "cancelada") return [x.motivo || "Cancelado", x.accion === "v3_fallo" ? "c-bad" : "c-off"];
  return [x.estado, "c-off"];
}

// ── Mis PRs ──

function porHistoria() {
  const d = S.datos;
  const analisisPorPr = {};
  for (const a of d.analisis || []) analisisPorPr[String(a.pr)] ||= a;
  const prs = {};
  for (const p of d.prs || []) prs[String(p.pr)] = { ...p };
  for (const a of d.analisis || []) {
    const k = String(a.pr);
    prs[k] = { pr: k, repo: a.repo, rama: a.rama, destino: a.destino, url: a.url, historia: a.historia, estado: "abierto", ...(prs[k] || {}) };
  }
  for (const p of Object.values(prs)) { p.analisis = analisisPorPr[p.pr] || null; p.historia = p.historia || (p.analisis && p.analisis.historia) || "Sin historia"; }
  return Object.values(prs);
}

function archivada(hu) { return ((S.datos || {}).ocultos || {})[`hu:${hu}`] === "archivado"; }
function prListo(p) { return p.estado === "mergeado" || p.estado === "cerrado" || !!p.aprobado_por; }
function gruposMis(historias) {
  const grupos = {};
  for (const p of porHistoria()) (grupos[p.historia] ||= { hu: p.historia, h: historias[p.historia], prs: [] }).prs.push(p);
  for (const g of Object.values(grupos)) g.filtro = archivada(g.hu) ? "archivadas" : g.prs.every(prListo) ? "aprobadas" : "pendientes";
  return Object.values(grupos);
}
function filtrar(historias) {
  const q = S.busca.trim().toLowerCase();
  const reciente = (g) => Math.max(...g.prs.map((p) => (p.analisis && p.analisis.analizado_en) || p.creado || 0));
  return gruposMis(historias)
    .filter((g) => g.filtro === S.filtroHu)
    .filter((g) => !q || g.prs.some((p) => `${g.hu} ${g.h ? g.h.titulo : ""} ${p.repo} ${p.pr} ${p.rama}`.toLowerCase().includes(q)))
    .sort((a, b) => reciente(b) - reciente(a));
}

function conteos(historias) {
  const c = {};
  for (const g of gruposMis(historias)) c[g.filtro] = (c[g.filtro] || 0) + 1;
  c.rechazados = (S.datos.rechazados || []).length;
  return c;
}
function vistaRechazados() {
  const q = S.busca.trim().toLowerCase();
  const filas = (S.datos.rechazados || []).filter((x) => !q || `${x.pr} ${repoDe(x.url)} ${x.motivo}`.toLowerCase().includes(q));
  if (!filas.length) return `<p class="vacio">${(S.datos.rechazados || []).length ? "Nada coincide con la búsqueda." : "No tienes pedidos rechazados en los últimos 30 días."}</p>`;
  return `<div class="rechazados">${filas.map((x) => `<div class="rechazado">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="mono">${esc(repoDe(x.url) || "PR")} ${/^https?:/.test(x.url) ? externo(x.url, `#${esc(x.pr)}`) : `#${esc(x.pr)}`}</span><span class="mono" style="font-size:12px;color:var(--tenue)">${esc(hace(x.en))}</span><span style="flex:1"></span><button class="btn chico" data-pedir="${esc(x.url)}">Pedir de nuevo</button></div>
      <span style="color:var(--suave);overflow-wrap:anywhere">${esc(x.motivo)}</span></div>`).join("")}</div>`;
}

function teEsperan(historias) {
  const ocultos = S.datos.ocultos || {}, porHu = {};
  for (const p of porHistoria()) { if (ocultos[`hu:${p.historia}`] === "archivado") continue; ((porHu[p.historia] ||= {})[p.repo] ||= []).push(p); }
  let n = 0;
  for (const repos of Object.values(porHu)) for (const [repo, prs] of Object.entries(repos)) n += caminoRepo(repo, prs).nodos.filter((x) => x.tono === "tu" || x.tono === "mal").length;
  return n;
}

function pedidoFin() {
  const p = S.pedido, d = S.datos || {};
  if (!p) return true;
  if (ahora() - p.en > 45 * 60) return true;
  const ped = (d.pedidos || []).filter((q) => String(q.pr) === String(p.pr)).sort((a, b) => epoch(b.en) - epoch(a.en))[0];
  if (ped && ped.resultado) return true;
  const an = (d.analisis || []).find((a) => String(a.pr) === String(p.pr));
  if (!an) return false;
  const corriendo = ["pendiente", "v3", "corriendo"].includes(an.estado) && !an.entregado;
  return !corriendo && epoch(an.analizado_en) >= p.en - 5;
}
function hayEnCurso() {

    && ahora() - epoch(a.analizado_en || a.creado || a.en || 0) < 3 * 3600);
}
function huDelPedido() {

}

function avisoPedido(enHistoria) {
  const p = S.pedido;
  if (!p) return "";
  const d = S.datos;
  const ped = (d.pedidos || []).filter((q) => String(q.pr) === String(p.pr)).sort((a, b) => epoch(b.en) - epoch(a.en))[0];
  const an = (d.analisis || []).find((a) => String(a.pr) === String(p.pr));
  const corriendo = an && (["pendiente", "v3", "corriendo"].includes(an.estado) && !an.entregado);
  const fresco = an && (corriendo || epoch(an.analizado_en) >= p.en - 5);
  let tono = "acc", estado = "en curso", sub = "", fin = false;
  if (ped && ped.resultado) { tono = "bad"; estado = "rechazado"; sub = String(ped.resultado).replace(/^rechazado:\s*/, ""); fin = true; }
  else if (fresco) {
    const [t, cls] = estadoPr(an); estado = t;

    fin = !corriendo;
    sub = corriendo ? (an.historia && !enHistoria ? `También lo ves abajo, en ${an.historia}.` : "") : "El análisis terminó: ábrelo para ver los hallazgos.";
  }
  if (an && an.historia && !p.abierto) { S.abiertos.add(`mis:${an.historia}`); p.abierto = true; }
  if (ped && ped.resultado) return tarjetaRechazo({ pr: p.pr, repo: p.repo, resultado: ped.resultado, en: ped.en },

  return `<div class="aviso-pedido t-${tono}" role="status">

    ${fin && an && !(ped && ped.resultado) ? `<button class="btn chico prim" data-abrir="${esc(an.id)}">Ver análisis</button>` : ""}
    <button class="icono" style="width:26px;height:26px" data-accion="cerrar-pedido" aria-label="Quitar este aviso">${I_CERRAR}</button>
    ${!fin ? `<div style="flex:1 1 100%;padding:6px 0 2px 22px">${pasosAnalisis(fresco ? an : null, p.en)}</div>` : ""}

}

    </div>

function semaforo(h) {
  if (!h) return "";
  const t = h.tiempo || {};
  const fmt = (n) => String(Math.round(n * 10) / 10).replace(".", ",");
  if (!t.estimadas) return `<span class="chip c-off" title="La historia no tiene story points en Jira: no puedo medir si va en tiempo.">sin estimar</span>`;
  if (t.usadas == null) return `<span class="chip c-off" title="${esc(`${h.puntos} SP = ${fmt(t.estimadas)} h hábiles. Todavía no pasó a En progreso en Jira.`)}">${esc(h.puntos)} SP · sin iniciar</span>`;
  const color = { ok: "var(--suave)", warn: "var(--warn)", bad: "var(--bad)" }[t.color] || "var(--suave)";
  const inicio = h.inicio ? new Date(h.inicio * 1000).toLocaleString("es-CO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const tip = `${h.puntos} SP = ${fmt(t.estimadas)} h hábiles (1 SP = 4 h). Lleva ${fmt(t.usadas)} h hábiles en En progreso${inicio ? ` (empezó el ${inicio})` : ""}: al pasar a PR staging deja de contar y, si vuelve a En progreso, sigue. `
    + (t.color === "ok" ? "Va dentro del tiempo." : t.color === "warn" ? "Se está acercando al tiempo estimado." : `Se pasó por ${fmt(t.usadas - t.estimadas)} h.`)
    + " Jornada: lunes a viernes, 9-13 y 14-18.";
  return `<span class="mono" style="font-size:12px;color:${color};white-space:nowrap" title="${esc(tip)}">${fmt(t.usadas)} / ${fmt(t.estimadas)} h</span>`;
}

const RAMAS = [["development", "dev"], ["master", "ci"], ["release", "prod"]];
const ramasDev = () => (S.datos && S.datos.sin_dev ? RAMAS.slice(1) : RAMAS);

function esIdor(d) { return (d && d.hallazgos || []).some((h) => /\bidor\b/i.test(`${h.titulo || ""} ${h.comentario || ""} ${h.categoria || ""}`)); }
function bloqueo(d) {
  if (!d || d.puntaje == null) return "el análisis no trajo resultado: vuelve a pedirlo";
  if (esIdor(d)) return "tiene un IDOR: corrígelo; solo el revisor lo cierra";
  if (Number(d.criticas || 0)) return `tiene ${d.criticas} crítica(s)`;
  if (Number(d.altas || 0)) return `tiene ${d.altas} alta(s)`;
  if (Number(d.medias || 0) > 2) return `tiene ${d.medias} medias (máximo 2)`;
  if (Number(d.puntaje) < 85) return `${d.puntaje} de 85: no alcanza para entregar`;
  return "";
}
function puertasDe(pr) { const x = (S.datos.detectados || []).find((y) => String(y.pr) === String(pr)); return x ? x : null; }

function notaCorta(nota) {
  if (!nota) return "";
  const div = document.createElement("div");
  div.innerHTML = nota;
  const texto = div.textContent.replace(/\s+/g, " ").trim();
  const largo = texto.length > 120 || /<details/.test(nota);
  if (!largo) return nota;
  const primera = (texto.split(" · ")[0] || texto).split(/(?<=\.)\s/)[0];
  return esc(primera.length > 110 ? `${primera.slice(0, 107)}…` : primera);
}
async function irAHistoria(hu) {
  S.tab = "mis"; S.cajon = null; S.busca = ""; S.abiertos.add(`mis:${hu}`);
  pintar();
  await cargar("mis,detectados,historias");

  if (g) S.filtroHu = g.filtro;

  if (i >= 0) S.pagina = Math.floor(i / POR_PAGINA) + 1;
  pintar();
  const sec = [...document.querySelectorAll("section.grupo")].find((x) => x.getAttribute("aria-label") === `Historia ${hu}`);
  if (sec) { sec.scrollIntoView({ behavior: "smooth", block: "start" }); sec.classList.add("resaltada"); setTimeout(() => sec.classList.remove("resaltada"), 2200); }
}
function rechazoDe(p) {
  const crudo = String(p.resultado || "").replace(/^rechazado:\s*/, "");
  const motivo = crudo.replace(/^#\d+\s+todavía no se puede analizar:\s*/, "");
  const m = motivo.match(/^falta código en ([\w./-]+):\s*([\s\S]*)$/);
  if (!m) return { resumen: motivo, archivos: [], pasos: [], rama: "" };
  const rama = m[1];
  const archivos = m[2].split(" · ").map((parte) => {
    const [nombre, ...resto] = parte.split(" → ");
    const det = resto.join(" → ");
    const mas = Number((det.match(/\(y (\d+) más\)\s*$/) || [])[1] || 0);
    const lineas = [];
    for (const x of det.replace(/\(y \d+ más\)\s*$/, "").split(/;\s+/)) {
      const quita = x.match(/^quitas `([\s\S]*?)` y .* todavía lo tiene/);
      if (quita) lineas.push({ tipo: "menos", t: quita[1] });
      else if (x.startsWith("`")) lineas.push({ tipo: "mas", t: x.replace(/^`/, "").replace(/`$/, "") + (x.trim().endsWith("`") ? "" : " …") });
      else if (x.trim()) lineas.push({ tipo: "nota", t: x.trim() });
    }
    return { nombre: nombre.trim(), lineas, mas };
  }).filter((a) => a.nombre);
  return { rama, archivos,
    resumen: `El PR trae cambios que ${rama} todavía no tiene.`,
    pasos: [`Lleva esos cambios a ${rama} con un PR de la misma historia, o saca tu rama desde ${rama} y aplica solo lo que ya está ahí.`,
            `Cuando ese PR quede mergeado en ${rama}, vuelve a pedir este análisis.`] };
}
function tarjetaRechazo(p, cerrar) {
  const clave = `pedido:${p.pr}`;
  if (!p.repo) p = { ...p, repo: ([...(S.datos.prs || []), ...(S.datos.analisis || [])].find((x) => String(x.pr) === String(p.pr)) || {}).repo || "" };
  const r = rechazoDe(p);
  const url = p.repo ? `https://us-east-1.console.aws.amazon.com/codesuite/codecommit/repositories/${p.repo}/pull-requests/${p.pr}` : "";
  S.motivos[clave] = { titulo: `${p.repo ? `${p.repo} ` : ""}#${p.pr}`, repo: "No se pudo analizar", html: "", url, rechazo: r };
  return `<div class="rechazo" role="status">
    <span class="icono-mal" aria-hidden="true">${I_ALERTA}</span>
    <div class="cuerpo"><b>No pude analizar <span class="mono">${esc(p.repo ? `${p.repo} ` : "")}#${esc(p.pr)}</span></b><span>${esc(r.resumen)}</span></div>
    ${p.en ? `<span class="mono" style="font-size:12px;color:var(--tenue);white-space:nowrap">${esc(hace(p.en))}</span>` : ""}
    <button class="btn chico prim" data-motivo="${esc(clave)}">${r.archivos.length ? "Ver qué falta" : "Ver motivo"}</button>
    ${cerrar}
  </div>`;
}
function cuerpoRechazo(r) {
  const archivos = r.archivos.map((a) => `<div>
      <div class="nombre"><span class="mono">${esc(a.nombre)}</span>${a.mas ? `<span class="mono" style="color:var(--warn-t)">+${esc(a.mas)} más</span>` : ""}</div>
      ${a.lineas.length ? `<div class="lineas mono">${a.lineas.map((l) => `<div class="${l.tipo}">${l.tipo === "mas" ? "+ " : l.tipo === "menos" ? "− " : ""}${esc(l.t)}</div>`).join("")}</div>` : ""}
    </div>`).join("");
  return `<section style="display:flex;flex-direction:column;gap:8px"><span class="rot-motivo mono">Qué pasó</span>
      <p style="margin:0;line-height:1.6">${r.rama ? `A esta rama solo entra código que ya está en <b>${esc(r.rama)}</b>. ` : ""}${esc(r.resumen)}${r.rama ? " El análisis no arrancó, así que no gastó tokens de tu Claude." : ""}</p></section>
    ${archivos ? `<section style="display:flex;flex-direction:column;gap:8px"><span class="rot-motivo mono">Dónde se nota la diferencia</span>
      <div class="falta-arch">${archivos}</div>
      <span style="font-size:12px;color:var(--tenue)">+ es lo que tu PR trae y ${esc(r.rama)} no tiene; − es lo que quitas y ${esc(r.rama)} todavía tiene. Son ejemplos: compara tu rama con ${esc(r.rama)} para ver todo.</span></section>` : ""}
    ${r.pasos.length ? `<section style="display:flex;flex-direction:column;gap:8px"><span class="rot-motivo mono">Qué hacer</span>
      <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.55">${r.pasos.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></section>` : ""}`;
}
function cajonMotivo() {
  const m = S.motivos[S.motivo];
  if (!m) return "";
  return `<div class="velo" data-cerrar aria-hidden="true"></div>
  <aside class="cajon cajon-motivo" role="dialog" aria-modal="true" aria-label="${esc(m.titulo)}">
    <header class="cajon-cab">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span class="rot">${esc(m.repo)}</span>
        <h2>${esc(m.titulo)}</h2>
      </div>
      <button class="icono" data-cerrar aria-label="Cerrar">${I_CERRAR}</button>
    </header>
    <div class="cajon-cuerpo">${m.rechazo ? cuerpoRechazo(m.rechazo) : `<div class="motivo-texto">${m.html.split(" · ").map((x) => `<p>${x}</p>`).join("")}</div>`}
      ${m.url ? `<a class="btn chico" style="align-self:flex-start" href="${esc(m.url)}" target="_blank" rel="noopener">Abrir el PR en CodeCommit</a>` : ""}</div>
  </aside>`;
}
function nodo(p, anterior, rama) {
  const link = p ? externo(p.url, `#${esc(p.pr)}`) : "";
  const rev = p && p.analisis && p.analisis.id ? `<button type="button" class="rev-id" data-copiar-rev="${esc(p.analisis.id)}" title="Copiar el ID de la revisión">REV/${esc(p.analisis.id)}</button>` : "";
  const n = (tono, que, nota, boton) => {
    const corta = notaCorta(nota);
    let motivo = "";
    if (corta !== nota) {
      const clave = `${rama}:${p ? p.pr : ""}`;
      S.motivos[clave] = { titulo: `${rama} ${p ? `#${p.pr}` : ""} · ${que}`, repo: p ? p.repo : "", html: nota, url: p ? p.url : "" };
      motivo = `<button class="btn fant chico" data-motivo="${esc(clave)}">Ver motivo</button>`;
    }
    return { tono, que, html: `<div class="nodo t-${tono}"><div class="nodo-cab"><span class="rama">${rama}</span>${link}${rev}</div><span class="que">${que}</span>${corta ? `<span class="nota">${corta}</span>` : ""}${boton || motivo ? `<span class="acciones">${motivo}${boton || ""}</span>` : ""}</div>` };
  };
  if (!p) {
    if (rama === "development") return n("no", "Sin PR", "", "");
    if (!anterior) return n("puede", "Puedes abrir el PR", "Pega su link en Analizar", "");
    if (anterior && anterior.tono === "hecho") return n("puede", "Puedes abrir el PR", rama === "release" ? "Al analizarlo corre el plan de pruebas en ci" : "Pega su link en Analizar", "");
    return n("no", "Sin PR todavía", rama === "master" ? "Se abre cuando development esté mergeado" : "Después de master", "");
  }
  const an = p.analisis, d = an ? datosDe(an) : null;
  const punt = d && d.puntaje != null ? `${d.puntaje}` : "";
  if (p.estado === "mergeado") return n("hecho", "Mergeado", [punt, an && an.entregado ? "entregado" : ""].filter(Boolean).join(" · "), "");
  if (p.estado === "cerrado") return n("no", "Cerrado sin mergear", "", "");
  if (p.aprobado_por) return n("ok", `Aprobado por ${p.aprobado_por === "Cristian" ? "el revisor" : "Hodor"}`, `${punt ? punt + " · " : ""}listo para mergear`, "");
  const ver = an ? `<button class="btn chico" data-abrir="${esc(an.id)}">Ver análisis</button>` : "";
  if (an) {
    if (an.estado === "corriendo" || an.estado === "v3" || (an.estado === "pendiente" && !an.entregado)) return n("corre", estadoPr(an)[0], "", ver);
    if (an.estado === "superada") return n("tu", "Cambió el commit", "Analízalo de nuevo", `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar</button>`);
    if (an.estado === "cancelada" && an.accion === "v3_fallo") return n("mal", "El análisis falló", an.motivo ? esc(an.motivo) : "Vuelve a pedirlo", `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar de nuevo</button>`);
    if (an.estado === "cancelada" && an.accion === "v3_reanalizar") return n("mal", "Hay que volver a analizar", an.motivo ? esc(an.motivo) : "", `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar de nuevo</button>`);
    if (an.estado === "v3_analizado" && an.reanalizar) return n("mal", "Hay que volver a analizar", esc(an.reanalizar), `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar de nuevo</button>`);
    if (an.estado === "v3_analizado") {
      const b = bloqueo(d);
      return b ? n("mal", `${punt ? punt + "/100 · " : ""}hay que corregir`, esc(b), `<button class="btn prim chico" data-abrir="${esc(an.id)}">Ver hallazgos</button>`)
               : n("tu", `${punt}/100 · listo para entregar`, "Revísalo y entrégalo", `<button class="btn prim chico" data-abrir="${esc(an.id)}">Entregar</button>`);
    }
    if (an.entregado && ["pendiente", "espera", "corriendo", "v3_listo"].includes(an.estado)) return n("corre", "Entregado · Hodor lo procesa", an.motivo ? esc(an.motivo) : "", ver);
    if (an.estado === "hecha" && an.accion === "comentado") return n("mal", "Con comentarios de Hodor", punt, ver);
  }
  const det = puertasDe(p.pr);
  const soloRamas = det && !det.porque && (det.puertas || []).some((x) => !x.ok) && (det.puertas || []).every((x) => x.ok || String(x.id).startsWith("rama-"));
  if (soloRamas) {
    const nota = (det.puertas || []).filter((x) => !x.ok).map((x) => esc(x.texto)).join(" · ");
    return n("tu", "Se puede analizar · no es aprobable", `${nota}. Puedes analizarlo y entregarlo; el aprobador lo ve marcado.`,
      `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar</button>`);
  }
  if ((det && !det.listo) || (det && det.porque)) {
    const malas = (det.puertas || []).filter((x) => !x.ok);
    const pq = det.porque;
    const nota = pq ? esc(pq.corto) : malas.map((x) => esc(x.texto)).join(" · ");
    const detalle = pq && (pq.lineas || []).length
      ? `<details class="porque"><summary>¿Por qué y cómo lo destrabo?</summary>${pq.lineas.map((l) => `<p>${esc(l)}</p>`).join("")}</details>` : "";
    const soloBuild = malas.length && malas.some((x) => x.id === "build") && malas.every((x) => x.id === "build" || (x.id === "sonar" && x.espera)) && !pq;
    if (soloBuild) {
      return n("mal", "CodeBuild falló", "Si fue tu código, corrígelo y haz push. Si el build ya dejó su aprobación en CodeCommit (falló solo el POST_BUILD), consulto CodeBuild y, si está aprobado, lo analizo.",
        `<button class="btn prim chico" data-pedir="${esc(p.url)}" title="Revisa en CodeCommit si la regla del build está aprobada en este commit y, si pasa, lo analiza">Consultar CodeBuild</button>`);
    }
    const soloSonar = malas.length && malas.every((x) => x.id === "sonar" && x.espera) && !pq;
    if (soloSonar) {
      const minutos = det.creado ? (Date.now() / 1000 - Number(det.creado)) / 60 : 0;
      return minutos < 5
        ? n("no", "Esperando a Sonar", "Sonar todavía no da su veredicto", "")
        : n("mal", "Sonar no avisó", "Pasaron más de 5 minutos sin el aviso de Sonar: consulto su resultado directo y, si está en verde, lo analizo.",
          `<button class="btn prim chico" data-pedir="${esc(p.url)}" title="Pregunta a Sonar por el quality gate de este commit y, si pasa, lo analiza">Consultar Sonar</button>`);
    }
    return n(malas.length && malas.every((x) => x.espera) && !pq ? "no" : "mal", "Todavía no se puede analizar", nota + detalle,
      `<button class="btn chico" data-pedir="${esc(p.url)}" title="Vuelve a revisar las puertas y, si pasan, lo analiza">Revisar de nuevo</button>`);
  }
  return n("tu", "Falta tu análisis", "abierto · sin aprobar", `<button class="btn prim chico" data-pedir="${esc(p.url)}">Analizar</button>`);
}

function caminoRepo(repo, prs) {
  const nodos = [];
  for (const [rama, a] of ramasDev()) {
    const lista = prs.filter((p) => amb(p) === a).sort((x, y) => (y.creado || 0) - (x.creado || 0));
    const vivo = lista.find((p) => p.estado === "abierto") || lista.find((p) => p.estado === "mergeado") || lista[0];
    nodos.push({ rama, p: vivo, ...nodo(vivo, nodos[nodos.length - 1], rama) });
  }
  return { repo, nodos, html: `<div class="camino" role="group" aria-label="${esc(repo)}: ${ramasDev().map((r) => r[0]).join(", ")}"><div class="camino-repo">${esc(repo)}</div>${nodos.map((x) => x.html).join("")}</div>` };
}

function siguiente(caminos) {
  const orden = ["mal", "tu", "ok", "puede"];
  const frases = [];
  for (const tono of orden) {
    for (const c of caminos) for (const x of c.nodos) {
      if (x.tono !== tono) continue;
      const pr = x.p ? `<b>${esc(c.repo)} #${esc(x.p.pr)}</b>` : `<b>${esc(c.repo)}</b>`;
      if (tono === "mal") frases.push(`Corrige ${pr} (${x.rama})`);
      if (tono === "tu") frases.push(x.p && x.p.analisis && x.p.analisis.estado === "v3_analizado" ? `Entrega ${pr}` : `Analiza ${pr}`);
      if (tono === "ok") frases.push(`Mergea ${pr}`);
      if (tono === "puede") frases.push(`Abre el PR de ${pr} a ${x.rama}`);
    }
  }
  return frases.length ? frases.slice(0, 3).join(" · ") + (frases.length > 3 ? ` · y ${frases.length - 3} más` : "") : "";
}

function resumenHu(caminos) {
  const n = { mal: 0, tu: 0, ok: 0, corre: 0, entregar: 0 };
  for (const c of caminos) for (const x of c.nodos) {
    if (x.tono in n) n[x.tono] += 1;
    if (x.tono === "tu" && /entregar/.test(x.que || "")) n.entregar += 1;
  }
  if (n.mal) return `<span class="chip c-bad">${n.mal} por corregir</span>`;
  if (n.tu) {
    const analizar = n.tu - n.entregar;
    const partes = [analizar ? `${analizar} por analizar` : "", n.entregar ? `${n.entregar} por entregar` : ""].filter(Boolean).join(" · ");
    return `<span class="chip c-warn" title="PRs donde el siguiente paso es tuyo: pedir el análisis o entregarlo a Hodor">${partes}</span>`;
  }
  if (n.corre) return `<span class="chip c-acc">Analizando</span>`;
  if (n.ok) return `<span class="chip c-ok">${n.ok} por mergear</span>`;
  return `<span class="chip c-off">al día</span>`;
}

function grupo(g) {
  const clave = `mis:${g.hu}`, abierto = S.abiertos.has(clave);
  const menuAbierto = S.menu === g.hu;
  const porRepo = {};
  for (const p of g.prs) (porRepo[p.repo] ||= []).push(p);
  const caminos = Object.entries(porRepo).sort().map(([repo, prs]) => caminoRepo(repo, prs));
  const sig = siguiente(caminos);
  return `<section class="grupo" aria-label="Historia ${esc(g.hu)}">
    <div class="grupo-cab">
      ${plegar(clave, g.hu)}
      ${g.h && g.h.url ? `<a class="clave clave-link" href="${esc(g.h.url)}" target="_blank" rel="noopener" title="Abrir ${esc(g.hu)} en Jira">${esc(g.hu)} ${I_EXTERNO}<span class="sr"> (abre Jira en otra pestaña)</span></a>` : `<span class="clave">${esc(g.hu)}</span>`}
      <span style="font-weight:500;flex:1 1 260px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.h ? g.h.titulo : "")}</span>
      ${!g.h && g.hu !== "Sin historia" ? `<span class="chip c-off" title="La clave sale de la rama o del título del PR, pero no existe en Jira (o no tienes acceso a ese proyecto). Revisa el nombre de la rama.">no existe en Jira</span>` : ""}
      ${semaforo(g.h)}
      ${resumenHu(caminos)}
      <button class="icono" data-menu="${esc(g.hu)}" aria-label="Más acciones de ${esc(g.hu)}" aria-haspopup="menu" aria-expanded="${menuAbierto}">${I_MAS}</button>
      ${menuAbierto ? `<div class="menu" role="menu">
        <button data-archivar="${esc(g.hu)}" role="menuitem">${archivada(g.hu) ? "Desarchivar historia" : "Archivar historia"}</button>
        ${g.h && g.h.url ? `<a href="${esc(g.h.url)}" target="_blank" rel="noopener" role="menuitem">Ver en Jira</a>` : ""}
        <button data-ayuda="${esc(g.hu)}" role="menuitem">Algo va mal · pedir ayuda</button>
        ${casoAbierto(g.hu) ? `<span class="menu-nota">Caso ${esc(casoAbierto(g.hu).codigo)} abierto · ${esc(hace(casoAbierto(g.hu).en))}</span>` : ""}
      </div>` : ""}
    </div>
    ${abierto ? `<div class="grupo-cuerpo">${huDelPedido() === g.hu ? avisoPedido(true) : ""}${sig ? `<div class="siguiente"><span class="rot">Siguiente</span><span>${sig}</span></div>` : ""}${caminos.map((c) => c.html).join("")}</div>` : ""}
  </section>`;
}

// ── Pedir ayuda ──

const TIPOS_AYUDA = [["no_analiza", "No me deja analizar"], ["analisis_mal", "El análisis está mal"], ["trabado", "No se aprueba / se quedó trabado"], ["otro", "Otro"]];
function casoAbierto(hu) { return ((S.casos || {}).casos || []).find((c) => c.historia === hu && c.estado !== "resuelto") || null; }
async function cargarCasos() { const r = await opcional("/api/ayuda"); S.casos = r && Array.isArray(r.casos) ? r : null; }
async function abrirAyuda(hu) {
  S.menu = ""; S.ayuda = { hu, tipo: "", texto: "", avisar: true, verCtx: false, ctx: null, enviando: false };
  pintar();
  const t = document.getElementById("ayuda-texto"); if (t) t.focus();
  let ctx;
  try { ctx = await api(`/api/ayuda/contexto?historia=${encodeURIComponent(hu)}`); } catch { ctx = { error: "no pude armar el contexto" }; }
  if (S.ayuda && S.ayuda.hu === hu) { S.ayuda.ctx = ctx; pintar(); }
}
function listaContexto(c) {
  if (!c) return `<p style="margin:8px 0 0">Armando el contexto…</p>`;
  if (c.error) return `<p style="margin:8px 0 0">${esc(c.error)}</p>`;
  const si = (v) => (v ? "sí" : "no");
  const prs = (c.prs || []).map((p) => `<li><span class="mono">${esc(p.repo)} #${esc(p.pr)}</span> · ${esc(p.destino || "")} · ${esc(p.estado || "")}${p.analisis ? ` · <span class="mono">${esc(p.analisis.codigo)}</span> ${esc(p.analisis.estado || "")}${p.analisis.puntaje != null ? ` · ${esc(p.analisis.puntaje)}/100` : ""}` : " · sin análisis"}${(p.puertas || []).filter((x) => !x.ok).length ? ` · ${(p.puertas || []).filter((x) => !x.ok).length} sin pasar de ${(p.puertas || []).length} puertas` : ""} · ${esc(nomMotor(p.motor || {}))}</li>`).join("");
  const config = c.config || {};
  return `<ul>
    <li>Los PRs de la historia con su último análisis (estado, motivo, puntaje), sus puertas y el porqué si no se puede analizar:${prs ? `<ul>${prs}</ul>` : " ninguno"}</li>
    <li>Pedidos de análisis con resultado: ${(c.pedidos || []).length}</li>
    <li>Worker <span class="mono">${esc(String(c.version || "").replace("v3-worker ", ""))}</span> · reglas <span class="mono">${esc(String(c.reglas_sha || "—").slice(0, 10))}</span> · ${esc(c.so || "")}</li>
    <li>Configuración (solo si está o no, nunca los valores): Jira ${si(config.jira)} · BD ${si(config.bd)} · usuarios ${esc(config.usuarios || 0)} · Backoffice ${si(config.bo)}</li>
    <li>Las últimas ${(c.log || []).length} líneas del log del worker, sin tokens ni contraseñas<pre>${esc((c.log || []).join("\n")) || "(vacío)"}</pre></li>
  </ul>`;
}
function vistaAyuda() {
  const A = S.ayuda;
  const g = gruposMis(S.datos.historias || {}).find((x) => x.hu === A.hu) || { hu: A.hu, h: (S.datos.historias || {})[A.hu], prs: [] };
  const orden = { dev: 0, ci: 1, prod: 2 };
  const prs = g.prs.slice().sort((a, b) => String(a.repo).localeCompare(String(b.repo)) || (orden[amb(a)] ?? 9) - (orden[amb(b)] ?? 9));
  return `<div class="modal"><div class="ayuda" role="dialog" aria-modal="true" aria-labelledby="ayuda-titulo">
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0"><span class="rot">Algo va mal · pedir ayuda</span>
        <h2 id="ayuda-titulo"><span class="mono" style="color:var(--acc)">${esc(A.hu)}</span> ${esc(g.h ? g.h.titulo : "")}</h2></div>
      <button class="icono" data-accion="ayuda-cerrar" aria-label="Cerrar">${I_CERRAR}</button>
    </div>
    ${prs.length ? `<ul class="ayuda-prs" aria-label="PRs de la historia">${prs.map((p) => `<li><span class="mono">${esc(p.repo)}</span>${externo(p.url, `#${esc(p.pr)}`)}<span class="rot">${esc(p.destino || amb(p))}</span>${p.analisis && p.analisis.id ? `<span class="mono" style="font-size:12px;color:var(--tenue)">REV/${esc(p.analisis.id)}</span>` : ""}</li>`).join("")}</ul>` : ""}
    <div style="display:flex;flex-direction:column;gap:8px"><span class="rot" id="ayuda-tipo">Qué pasa</span>
      <div class="barra" role="group" aria-labelledby="ayuda-tipo">${TIPOS_AYUDA.map(([k, l]) => `<button class="filtro" aria-pressed="${A.tipo === k}" data-ayuda-tipo="${k}">${l}</button>`).join("")}</div></div>
    <label for="ayuda-texto" class="rot">Cuéntale al revisor qué pasa</label>
    <textarea id="ayuda-texto" rows="5" data-foco="ayuda-texto" data-ayuda-texto placeholder="Qué intentaste, qué esperabas y qué pasó">${esc(A.texto)}</textarea>
    <label class="ayuda-check"><input type="checkbox" data-ayuda-avisar ${A.avisar ? "checked" : ""}>Avisarle al revisor ahora</label>
    <details class="ayuda-ctx" data-ayuda-ctx ${A.verCtx ? "open" : ""}><summary>Qué se envía</summary>${listaContexto(A.ctx)}</details>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn fant" data-accion="ayuda-cerrar">Cancelar</button>
      <button class="btn prim" data-accion="ayuda-enviar" ${A.enviando ? "disabled" : ""}>${A.enviando ? "Enviando…" : "Enviar"}</button>
    </div>
  </div></div>`;
}
async function enviarAyuda() {
  const A = S.ayuda;
  if (!A || A.enviando) return;
  if (!A.tipo) return aviso("Elige qué pasa.", "bad");
  if (A.tipo === "otro" && A.texto.trim().length < 3) return aviso("Escribe qué pasa para que el revisor lo entienda.", "bad");
  A.enviando = true; pintar();
  let r;
  try { r = await api("/api/ayuda", { historia: A.hu, tipo: A.tipo, texto: A.texto.trim(), avisar: A.avisar }); } catch { r = { error: "No pude hablar con tu worker." }; }
  if (r.error) { if (S.ayuda) S.ayuda.enviando = false; pintar(); return aviso(r.error, "bad"); }
  S.ayuda = null;
  aviso(A.avisar ? `Caso ${r.codigo} enviado al revisor` : `Caso ${r.codigo} guardado: el revisor lo ve en su lista`, "ok");
  pintar();
  await cargarCasos(); pintar();
}

      <label for="sug" class="sr">Tu sugerencia</label>

}

// ── Cajón: hallazgos por ronda, debate, plan de pruebas e historial ──

function urlAiContext(archivo) { return AI_CONTEXT + String(archivo || "").replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/"); }
function fundamento(f) {
  if (f && f.archivo) {
    return `<div class="fund"><div class="fund-cab"><span class="rot">Fundamento</span><span class="mono">ai-context · ${esc(f.archivo)}</span>${f.seccion ? `<span style="color:var(--suave)">§ ${esc(f.seccion)}</span>` : ""}${externo(urlAiContext(f.archivo), "Abrir en CodeCommit")}</div>${f.cita ? `<q>${esc(f.cita)}</q>` : ""}</div>`;
  }
  return `<span class="sin-fund">Regla del revisor, todavía sin documento.</span>`;
}

function tarjetaHallazgo(hh, extra) {
  return `<article class="h" id="hallazgo-${esc(hh._i)}" style="${hh._retirado ? "opacity:.6" : hh._fuera ? "border-style:dashed;opacity:.85" : ""}">
    <div class="h-cab">${sevChip(hh.severidad)}${hh._idor ? `<span class="chip may c-bad">IDOR</span>` : ""}<b style="font-weight:500;${hh._retirado ? "text-decoration:line-through" : ""}">${esc(hh.titulo)}</b>${extra || ""}<span class="donde">${esc(String(hh.archivo || "").split("/").pop())}${hh.linea ? `:${esc(hh.linea)}` : ""}${hh.categoria ? ` · ${esc(hh.categoria)}` : ""}</span></div>
    <p>${esc(hh.comentario)}</p>${fundamento(hh.fuente)}</article>`;
}

function seccionHallazgos(x, d) {
  if (!d.resumen) return "";
  const hall = d.hallazgos || [];
  const vacio = `<div style="padding:18px;border-radius:10px;border:1px dashed var(--linea-3);color:var(--tenue);text-align:center">Sin hallazgos. Nada que corregir antes de entregar.</div>`;
  const marca = (h) => h._retirado ? `<span class="chip c-off">retirado en el debate</span>` : "";
  const cab = (t, sub) => `<div class="grupo-h-cab"><b>${t}</b>${sub ? `<span>${sub}</span>` : ""}</div>`;
  if (!x.ronda) return `<section class="grupo-h">${cab(`Hallazgos · ${hall.length}`)}${hall.length ? hall.map((h) => tarjetaHallazgo(h, marca(h))).join("") : vacio}</section>`;
  const r = x.ronda, grupoIds = (ids) => hall.filter((h) => ids.includes(h._i));
  const previos = grupoIds(r.previos || []), nuevos = grupoIds(r.nuevos || []), fuera = grupoIds(r.fuera || []);
  return `<div class="aviso c-acc">Ronda ${esc(r.numero || 2)}: lo analizado no cambia. Se verificaron los hallazgos de la ronda anterior y solo cuentan los nuevos que están en las líneas que cambiaste. Un IDOR cuenta siempre.</div>
    <section class="grupo-h">${cab(`Siguen · ${previos.length}`, "de la ronda anterior, sin corregir")}${previos.length ? previos.map((h) => tarjetaHallazgo(h, marca(h))).join("") : `<span style="color:var(--tenue);font-size:13px">Todos los de la ronda anterior quedaron corregidos.</span>`}</section>
    ${nuevos.length ? `<section class="grupo-h">${cab(`Nuevo en tu cambio · ${nuevos.length}`, "líneas que tocaste en este commit")}${nuevos.map((h) => tarjetaHallazgo(h, marca(h))).join("")}</section>` : ""}
    ${fuera.length ? `<section class="grupo-h">${cab(`Fuera de alcance · ${fuera.length}`, "no te bloquea: está en código que no cambió desde la ronda anterior, no suma al puntaje y le llega al revisor")}${fuera.map((h) => tarjetaHallazgo(h, `<span class="chip c-acc">va al revisor</span>`)).join("")}</section>` : ""}`;
}

function rondasDelPr(x) {
  return (S.datos.analisis || []).filter((a) => String(a.pr) === String(x.pr)).sort((a, b) => Number(a.id) - Number(b.id));
}
function burbujaDebate(m) {
  return m.rol === "dev"
    ? `<div class="burbuja-yo">${esc(m.texto)}</div>`
    : `<div class="burbuja-el"><span style="white-space:pre-wrap">${esc(m.texto)}</span>
       ${m.meta && m.meta.retirado != null ? `<span class="chip c-ok" style="align-self:flex-start">retirado: ${esc(m.meta.titulo || "")}${m.meta.puntaje != null ? ` · puntaje ${esc(m.meta.puntaje)}` : ""}</span>` : ""}
       ${m.meta && m.meta.rechazado ? `<span class="chip c-bad" style="align-self:flex-start">${esc(m.meta.rechazado)}</span>` : ""}
       ${m.meta && m.meta.error ? `<span class="chip c-bad" style="align-self:flex-start">${esc(m.meta.error === true ? "error" : m.meta.error)}</span>` : ""}</div>`;
}
function seccionDebate(x, d) {
  if (["v3", "corriendo", "pendiente"].includes(x.estado) && !x.entregado) return "";
  const debate = x.estado === "v3_analizado" && !!bloqueo(d);
  const enMaquina = (S.datos.sesiones || []).map(String).includes(String(x.id));
  const chat = (S.debate[x.id] || []);
  const rondas = rondasDelPr(x);
  const anteriores = rondas.filter((a) => String(a.id) !== String(x.id) && (S.debate[a.id] || []).length).map((a) => {
    const n = rondas.indexOf(a) + 1;
    return `<details><summary style="cursor:pointer;color:var(--suave)">Ronda ${n} · REV/${esc(a.id)} · ${(S.debate[a.id] || []).length} mensaje${(S.debate[a.id] || []).length === 1 ? "" : "s"}</summary>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">${S.debate[a.id].map(burbujaDebate).join("")}</div></details>`;
  }).join("");
  const bitacora = rondas.flatMap((a) => a.debate || []).map((b) => `<li><b>${esc(b.titulo)}</b> (${esc(b.severidad)}): ${esc(b.argumento)}</li>`).join("");
  const nRetirados = rondas.reduce((n, a) => n + (a.debate || []).length, 0);
  const pensando = S.pensando === `debate:${x.id}` ? `<span class="chip c-acc" style="align-self:flex-start">la revisión está leyendo el código…</span>` : "";
  const entrada = debate
    ? (enMaquina ? `<div style="display:flex;gap:10px;align-items:flex-end"><label for="msg-debate" class="sr">Tu argumento</label>
      <textarea id="msg-debate" rows="2" style="flex:1" placeholder="Argumenta con evidencia: archivo, línea, prueba…"></textarea>
      <button class="btn prim" data-debatir="${esc(x.id)}" ${S.pensando ? "disabled" : ""}>Enviar</button></div>`
      : `<span style="color:var(--warn);font-size:13px">La sesión de esta revisión no está en esta máquina: vuelve a analizar el PR para poder discutirla.</span>`)
    : `<div style="display:flex;gap:10px;align-items:flex-end"><label for="msg-debate" class="sr">Tu pregunta</label>
      <textarea id="msg-debate" rows="2" style="flex:1" placeholder="Pregunta sobre el análisis, un hallazgo o el código…"></textarea>
      <button class="btn prim" data-consultar="${esc(x.id)}" ${S.pensando ? "disabled" : ""}>Preguntar</button></div>`;
  return `<section class="caja" style="gap:12px" aria-label="${debate ? "Debate" : "Preguntas sobre este PR"}">
    <b>${debate ? "Discutir con la revisión" : "Preguntas sobre este PR"}</b>
    <span style="color:var(--suave);font-size:13px">${debate
      ? "Es la misma sesión que hizo este análisis. Reglas fijas: el puntaje no se negocia; un hallazgo medio o bajo se retira solo con evidencia verificada en el código; una crítica, una alta o un IDOR no se retiran aquí: se hablan con el revisor. Cada retiro le llega a Hodor con tu argumento."
      : "Pregúntale a la revisión sobre este análisis aunque el PR ya esté entregado o mergeado: por qué marcó algo, cómo corregirlo o qué revisó. Aquí no se retiran hallazgos ni cambia el puntaje."}</span>
    ${d.puntaje_original != null && d.puntaje_original !== d.puntaje ? `<span class="mono" style="font-size:13px;color:var(--suave)">Puntaje: ${esc(d.puntaje_original)} → ${esc(d.puntaje)} (recalculado por los hallazgos que salieron, no por pedido)</span>` : ""}
    ${bitacora ? `<details><summary style="cursor:pointer;color:var(--suave)">Retirados en el debate · ${nRetirados}</summary><ul style="margin:8px 0 0;padding-left:18px;color:var(--suave);line-height:1.6">${bitacora}</ul></details>` : ""}
    ${anteriores}
    <div style="display:flex;flex-direction:column;gap:12px">${chat.map(burbujaDebate).join("") || `<span style="color:var(--tenue);font-size:13px">${rondas.length > 1 ? "Todavía no hay mensajes en esta ronda." : "Todavía no hay mensajes."}</span>`}${pensando}</div>
    ${entrada}
  </section>`;
}

const JSON_CLR = { k: "var(--acc)", s: "var(--ok)", n: "var(--warn)", b: "var(--bad)", p: "var(--tenue)", l: "var(--tenue-2)" };
function jsonBonito(texto) {
  let v;
  try { v = typeof texto === "string" ? JSON.parse(texto) : texto; } catch { return `<pre style="margin:0">${esc(texto)}</pre>`; }
  const lineas = [];
  const prim = (x) => `<span style="color:${typeof x === "string" ? JSON_CLR.s : typeof x === "number" ? JSON_CLR.n : JSON_CLR.b}">${esc(JSON.stringify(x))}</span>`;
  const p = (s) => `<span style="color:${JSON_CLR.p}">${esc(s)}</span>`;
  const andar = (x, ind, clave, coma) => {
    const pre = "  ".repeat(ind) + (clave != null ? `<span style="color:${JSON_CLR.k}">"${esc(clave)}"</span>${p(": ")}` : ""), c = coma ? p(",") : "";
    if (x === null || typeof x !== "object") return lineas.push(pre + prim(x) + c);
    const arr = Array.isArray(x), ks = arr ? x.map((_, i) => i) : Object.keys(x);
    if (!ks.length) return lineas.push(pre + p(arr ? "[]" : "{}") + c);
    lineas.push(pre + p(arr ? "[" : "{"));
    ks.slice(0, 200).forEach((k, i) => andar(x[k], ind + 1, arr ? null : k, i < Math.min(ks.length, 200) - 1));
    lineas.push("  ".repeat(ind) + p(arr ? "]" : "}") + c);
  };
  andar(v, 0, null, false);
  return `<div class="mono" style="font-size:12px;line-height:1.6;max-height:420px;overflow:auto">${lineas.map((l, i) => `<div style="display:grid;grid-template-columns:34px minmax(0,1fr);white-space:pre-wrap;word-break:break-all"><span style="text-align:right;padding-right:10px;color:${JSON_CLR.l};user-select:none">${i + 1}</span><span>${l}</span></div>`).join("")}</div>`;
}

function md(texto) {
  const filas = String(texto || "").split("\n"), out = [];
  let tabla = [];
  const enLinea = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, `<code>$1</code>`);
  const cerrarTabla = () => { if (!tabla.length) return; const [cab, , ...cuerpo] = tabla; out.push(`<div style="overflow:auto"><table><tr>${cab.map((c) => `<th>${enLinea(c)}</th>`).join("")}</tr>${cuerpo.map((f) => `<tr>${f.map((c) => `<td>${enLinea(c)}</td>`).join("")}</tr>`).join("")}</table></div>`); tabla = []; };
  for (const l of filas) {
    if (/^\s*\|/.test(l)) { tabla.push(l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim())); continue; }
    cerrarTabla();
    if (/^#{1,3} /.test(l)) out.push(`<h3 style="margin:10px 0 2px;font-size:15px">${enLinea(l.replace(/^#+ /, ""))}</h3>`);
    else if (/^\s*[-*] /.test(l)) out.push(`<div style="padding-left:14px">• ${enLinea(l.replace(/^\s*[-*] /, ""))}</div>`);
    else if (l.trim()) out.push(`<p style="margin:0;line-height:1.6;color:var(--suave)">${enLinea(l)}</p>`);
  }
  cerrarTabla();
  return out.join("");
}

function curlDe(paso) {
  const q = (s) => `'${String(s).replace(/'/g, "'\\''")}'`;
  const partes = [`curl -X ${paso.metodo || "GET"} ${q(paso.url || "")}`];
  for (const [k, v] of Object.entries(paso.cabeceras || {})) partes.push(`-H ${q(`${k}: ${v === "•••" ? `<${k}>` : v}`)}`);
  if (paso.enviado) partes.push(`--data-raw ${q(paso.enviado)}`);
  return partes.join(" \\\n  ");
}

function seccionPruebas(x) {
  if ((x.destino || "") !== "release") return "";
  const local = S.plan[x.id] || {}, estadoLocal = (S.datos.planes || {})[x.id] || {};
  const p = local.plan ? local : (x.pruebas ? { ...x.pruebas, estado: "hecho" } : local);
  const estado = local.estado || estadoLocal.estado || (x.pruebas ? "hecho" : "");
  const dic = p.dictamen, plan = p.plan || {}, eje = p.ejecucion || {};
  const res = Object.fromEntries((eje.escenarios || []).map((e) => [e.id, e]));
  const dEsc = Object.fromEntries(((dic || {}).escenarios || []).map((e) => [e.id, e]));
  const vivo = ["pendiente", "armando", "listo", "ejecutando", "evaluando", "dictando", "corrigiendo"].includes(estado);
  const textos = { pendiente: "En cola en tu worker.", armando: "Tu IA lee el código de master, la BD de ci y elige tus usuarios.", listo: "Plan listo: arranca la ejecución.",
    ejecutando: "Ejecutando los escenarios contra ci.", evaluando: "Esperando el dictamen.", dictando: "Tu IA revisa el log y confirma cada falla con el código.", corrigiendo: "Ejecutando otra vez con la corrección." };
  const tono = (r) => ({ pasa: "c-ok", falla: "c-bad", no_ejecutado: "c-warn", no_ejecutable: "c-warn", no_preparado: "c-warn", invalido: "c-warn" }[r] || "c-off");
  const hist = (x.pruebas_hist || []);
  const antesDespues = (e) => {
    if (!e.idor) return "";
    const corridas = hist.map((h) => ({ h, r: ((h.dictamen || {}).escenarios || []).find((y) => y.id === e.id), l: ((h.ejecucion || {}).escenarios || []).find((y) => y.id === e.id) })).filter((c) => c.r);
    const antes = corridas.find((c) => c.r.resultado === "falla"), despues = [...corridas].reverse().find((c) => c.r.resultado === "pasa");
    if (!antes || !despues || antes === despues) return "";
    const lado2 = (c, t, clr) => { const paso = (c.l && (c.l.pasos || []).filter((y) => y.tipo === "prueba").pop()) || {}; return `<div class="caja" style="gap:6px;border-color:${clr}"><b>${t}</b><span class="mono" style="font-size:12px;color:var(--tenue)">commit ${esc(c.h.commit || "?")} · ${esc(paso.status ?? "")}</span>${jsonBonito(paso.respuesta || "")}</div>`; };
    return `<div class="dos">${lado2(antes, "Antes · con el hallazgo", "var(--bad)")}${lado2(despues, "Después · con la corrección", "var(--ok)")}</div>`;
  };
  const pasoHtml = (e, pl, i) => {
    const clave = `${x.id}:${e.id}:${i}`, abierto = S.abiertos.has(`paso:${clave}`);
    const st = pl.status != null ? `<span class="chip mono ${pl.ok ? "c-ok" : "c-bad"}">${esc(pl.status)}</span>` : pl.error ? `<span class="chip c-bad">error</span>` : "";
    return `<div style="border:1px solid var(--linea);border-radius:10px;overflow:hidden">
      <button class="fila" data-plegar="paso:${esc(clave)}" aria-expanded="${abierto}" style="border-top:0;gap:10px"><span class="mono" style="color:var(--tenue)">${i + 1}.</span><span class="chip c-off">${esc(pl.tipo || "")}</span><span class="mono" style="color:var(--warn)">${esc(pl.metodo || "")}</span>
        <span style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="mono" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(String(pl.url || "").replace(/^https?:\/\/[^/]+/, ""))}</span><span style="font-size:12px;color:var(--tenue)">${esc(pl.nombre || "")}</span></span>
        ${pl.via ? `<span class="chip c-info">por ${esc(pl.via === "gateway" ? "gateway" : pl.via === "admin" ? "backoffice" : "lb-ci")}</span>` : ""}${pl.usuario ? `<span style="font-size:12px;color:var(--tenue)">usuario ${esc(pl.usuario)}</span>` : ""}${pl.ms != null ? `<span class="mono" style="font-size:12px;color:var(--tenue)">${esc(pl.ms)} ms</span>` : ""}${st}</button>
      ${abierto ? `<div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea-2)">
        ${(pl.checks || []).length ? `<div class="barra"><span class="rot">Chequeos</span>${pl.checks.map((c) => `<span class="chip mono ${c.ok ? "c-ok" : "c-bad"}">${esc(c.que)}: ${esc(JSON.stringify(c.espera))} → ${esc(JSON.stringify(c.obtuvo))}</span>`).join("")}</div>` : ""}
        ${pl.error ? `<div class="aviso c-bad">${esc(pl.error)}</div>` : ""}
        <div class="dos">
          <div class="caja" style="gap:8px;padding:0;overflow:hidden"><div class="barra" style="padding:8px 10px;background:var(--hondo)"><span class="rot">Enviado</span><span style="flex:1"></span>${pl.metodo !== "SQL" ? `<button class="btn chico" data-copiar="${esc(curlDe(pl))}">cURL</button>` : ""}</div>
            <div style="padding:0 10px 10px">${Object.entries(pl.cabeceras || {}).filter(([k]) => k !== "accept").map(([k, v]) => `<div class="mono" style="font-size:12px"><span style="color:var(--tenue)">${esc(k)}</span> ${esc(v)}</div>`).join("")}${pl.enviado ? jsonBonito(pl.enviado) : pl.metodo === "SQL" ? `<pre style="margin:0">${esc(pl.url)}</pre>` : ""}</div></div>
          <div class="caja" style="gap:8px;padding:0;overflow:hidden"><div class="barra" style="padding:8px 10px;background:var(--hondo)"><span class="rot">Recibido</span>${st}<span style="flex:1"></span><button class="btn chico" data-copiar="${esc(pl.respuesta || "")}">Copiar</button></div>
            <div style="padding:0 10px 10px">${jsonBonito(pl.respuesta || "")}</div></div>
        </div></div>` : ""}
    </div>`;
  };
  const escenario = (e) => {
    const r = res[e.id] || {}, de = dEsc[e.id] || {}, resultado = de.resultado || r.resultado || (e.ejecutable === false ? "no_ejecutable" : "");
    const clave = `esc:${x.id}:${e.id}`, abierto = S.abiertos.has(clave);
    return `<div style="border:1px solid ${abierto ? "var(--linea-3)" : "var(--linea)"};border-radius:10px;overflow:hidden;background:var(--caja)">
      <button class="fila" data-plegar="${esc(clave)}" aria-expanded="${abierto}" style="border-top:0">${CHEVRON.replace("<svg", `<svg style="transform:rotate(${abierto ? 0 : -90}deg)"`)}${resultado ? `<span class="chip may ${tono(resultado)}">${esc(resultado.replace(/_/g, " "))}</span>` : ""}<span class="chip ${e.tipo === "seguridad" ? "c-nar" : e.tipo === "feliz" ? "c-ok" : e.tipo === "error" ? "c-bad" : "c-off"}">${esc(e.tipo)}</span>${e.idor ? `<span class="chip may c-bad">IDOR</span>` : ""}<b style="font-weight:500;flex:1">${esc(e.nombre)}</b>
        ${e.si_falla ? `<span class="chip ${e.si_falla === "critico" ? "c-bad" : e.si_falla === "medio" ? "c-warn" : "c-off"}" style="background:none;border-color:currentColor">si falla: ${esc(e.si_falla)}</span>` : ""}</button>
      ${abierto ? `<div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea-2)">
        <p style="margin:0;color:var(--suave);line-height:1.5">${esc(e.objetivo || "")}</p>
        ${e.ejecutable === false ? `<div class="aviso c-warn">${esc(e.motivo || "No ejecutable")}</div>` : ""}
        ${de.explicacion ? `<p style="margin:0;line-height:1.5"><b style="font-weight:500">Dictamen:</b> ${esc(de.explicacion)}</p>` : ""}
        ${antesDespues(e)}
        ${(r.pasos || []).map((pl, i) => pasoHtml(e, pl, i)).join("")}</div>` : ""}
    </div>`;
  };
  const chat = (local.chat || []);
  const burbuja = (m) => m.rol === "dev"
    ? `<div class="burbuja-yo">${esc(m.texto)}</div>`
    : `<div class="burbuja-el"><span style="white-space:pre-wrap">${esc(m.texto)}</span>${m.meta && m.meta.cambio ? `<span class="chip c-acc" style="align-self:flex-start">corrección de datos${m.meta.repetir ? ` · ${esc(m.meta.repetir.join(", "))}` : ""}</span>` : ""}${m.meta && m.meta.rechazado ? `<span class="chip c-bad" style="align-self:flex-start">no aplicado: ${esc(m.meta.rechazado)}</span>` : ""}</div>`;
  const falta = (S.datos.estado || {}).falta_pruebas;
  return `<section style="display:flex;flex-direction:column;gap:14px" aria-label="Plan de pruebas">
    <div class="freno" style="align-items:center;padding:14px 16px">
      ${dic ? `<span class="mono" style="font-size:32px;line-height:36px;color:${dic.veredicto === "pasa" ? "var(--ok)" : dic.veredicto === "no_pasa" ? "var(--bad)" : "var(--warn)"}">${esc(dic.puntaje ?? "—")}<small style="font-size:16px;color:var(--suave)">/10</small></span>` : ""}
      <div style="display:flex;flex-direction:column;gap:2px;flex:1 1 240px"><b>${dic ? esc(String(dic.veredicto || "").replace(/_/g, " ")) : "Plan de pruebas en ci"}</b><span style="color:var(--suave);font-size:13px">Corre en tu máquina contra ci.</span></div>
      ${local.plan || estado === "falta_config" || estado === "error" ? `<button class="btn" data-plan-otra="${esc(x.id)}" ${vivo ? "disabled" : ""}>${local.plan ? "Ejecutar todo otra vez" : "Intentar de nuevo"}</button>` : ""}
      ${dic && dic.documento ? `<button class="btn fant" data-descargar-md="${esc(x.id)}">Descargar .md</button>` : ""}
    </div>
    ${vivo ? `<div class="aviso c-acc">${esc(textos[estado] || estado)}</div>` : ""}
    ${estado === "falta_config" || (!estado && falta) ? `<div class="aviso c-warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1">${esc(falta || local.error)}.</span><button class="btn chico" data-accion="config">Configurar</button></div>` : ""}
    ${local.error && estado !== "falta_config" ? `<div class="aviso c-bad">${esc(local.error)}</div>` : ""}
    ${!estado && !falta ? `<span style="color:var(--tenue)">Se arma solo cuando el análisis de este PR a release termina en tu worker.</span>` : ""}
    ${dic ? `${(dic.hallazgos || []).map((h) => `<div class="aviso ${h.severidad === "critico" ? "c-bad" : "c-warn"}"><b>${esc(h.severidad)}: ${esc(h.titulo)}</b><br>${esc(h.evidencia || "")}${h.recomendacion ? `<br><span style="color:var(--suave)">${esc(h.recomendacion)}</span>` : ""}</div>`).join("") || `<div class="aviso c-ok">Sin hallazgos.</div>`}
      ${dic.documento ? `<details><summary style="cursor:pointer"><b>Documento del dictamen</b></summary><article style="padding-top:8px">${md(dic.documento)}</article></details>` : ""}` : ""}
    ${plan.resumen ? `<span class="rot">Qué se prueba</span><p style="margin:0;color:var(--suave);line-height:1.6">${esc(plan.resumen)}</p>` : ""}
    ${(plan.escenarios || []).length ? `<span class="rot">Escenarios · ${plan.escenarios.length}</span>${plan.escenarios.map(escenario).join("")}` : ""}
    ${(plan.no_cubierto || []).length ? `<span class="rot">No cubierto</span><ul style="margin:0;padding-left:18px;color:var(--suave)">${plan.no_cubierto.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    ${local.plan ? `<div style="border:1px solid var(--linea-3);border-radius:10px;overflow:hidden"><div style="padding:12px 14px;background:var(--hondo)"><b>Corregir datos del plan</b><div style="font-size:12.5px;color:var(--suave)">Chat con la misma IA que armó el plan, para cuando un escenario falla por un dato: la URL, la vía, una cabecera, un parámetro, un id. Aquí se corrige cómo se prueba, nunca qué se espera.</div></div>
      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">${chat.map(burbuja).join("")}${S.pensando === `plan:${x.id}` ? `<span class="chip c-acc" style="align-self:flex-start">revisando el código y el plan…</span>` : ""}
      <div style="display:flex;gap:10px;align-items:flex-end"><label for="msg-plan" class="sr">Qué dato está mal</label><textarea id="msg-plan" rows="2" style="flex:1" placeholder="Qué dato está mal: URL, vía, cabecera, parámetro, id…"></textarea><button class="btn prim" data-plan-chat="${esc(x.id)}" ${S.pensando || vivo ? "disabled" : ""}>Enviar</button></div>
      <span style="font-size:12px;color:var(--tenue)">Un status o una respuesta que el código no debería dar no se vuelve correcta aquí. Desde el panel no se puede marcar un escenario como válido.</span></div></div>` : ""}
  </section>`;
}

const TIPO_EVENTO = { corregido: "c-ok", sigue: "c-nar", nuevo: "c-warn", retirado: "c-off", rechazado: "c-bad", entregado: "c-acc" };
function seccionHistorial(x) {
  const h = S.hist[String(x.pr)];
  if (h === undefined) return `<p class="vacio">Cargando el historial…</p>`;
  if (!h) return `<p class="vacio">El historial no está disponible.</p>`;
  const rondas = h.rondas || [];
  if (!rondas.length) return `<p class="vacio">Todavía no hay revisiones de este PR.</p>`;
  return rondas.map((r, i) => {
    const clave = `hist:${x.pr}:${r.fila ?? i}`, abierto = S.abiertos.has(clave), n = rondas.length - i;
    const c = r.conteo || {};
    const conteo = [["criticas", "crítica", "críticas"], ["altas", "alta", "altas"], ["medias", "media", "medias"], ["bajas", "baja", "bajas"]].filter(([k]) => Number(c[k] || 0)).map(([k, s, pl]) => `${c[k]} ${Number(c[k]) === 1 ? s : pl}`).join(" · ") || "sin hallazgos";
    return `<article class="ronda">
      <button class="fila" data-plegar="${esc(clave)}" aria-expanded="${abierto}">
        <span class="rot" style="color:var(--texto)">Ronda ${n}${i === 0 ? " · actual" : ""}</span>
        ${r.commit ? `<span class="mono" style="font-size:12px;color:var(--tenue)">${esc(String(r.commit).slice(0, 7))}</span>` : ""}
        <span style="font-size:12px;color:var(--tenue)">${esc(fecha(r.creado))}</span>
        <span style="flex:1"></span>
        ${r.entregado ? `<span class="chip c-acc">entregado</span>` : ""}
        <span class="mono" style="font-size:16px;color:${colorPuntaje(r.puntaje)}">${esc(r.puntaje ?? "—")}<small style="font-size:11px;color:var(--tenue)">/100</small></span>
        <span style="font-size:12px;color:var(--suave)">${esc(conteo)}</span>
        ${CHEVRON.replace("<svg", `<svg style="transform:rotate(${abierto ? 0 : -90}deg)"`)}
      </button>
      ${abierto ? (r.eventos || []).map((e) => `<div class="evento"><span class="chip may ${TIPO_EVENTO[e.tipo] || "c-off"}">${esc(e.tipo)}</span><span style="flex:1 1 300px">${esc(e.texto)}</span><span class="mono" style="font-size:11px;color:var(--tenue)">${esc(fecha(e.en))}</span></div>`).join("") || `<div class="evento" style="color:var(--tenue)">Sin eventos en esta ronda.</div>` : ""}
    </article>`;
  }).join("");
}

async function cargarCajon(id) {
  const x = (S.datos.analisis || []).find((a) => String(a.id) === String(id));
  if (!x) return;
  const pr = String(x.pr), primeraVez = !(pr in S.hist);
  const [plan, deb, hist] = await Promise.all([
    (x.destino || "") === "release" ? api(`/api/plan/${id}`).catch(() => null) : Promise.resolve(null),
    Promise.all(rondasDelPr(x).map((a) => api(`/api/debate/${a.id}`).then((r) => [a.id, r]).catch(() => [a.id, null]))),
    opcional(`/api/historial/${encodeURIComponent(pr)}`)]);
  if (plan) S.plan[id] = plan;
  for (const [fila, r] of deb) if (r) S.debate[fila] = r.chat || [];
  S.hist[pr] = hist && Array.isArray(hist.rondas) ? hist : null;
  if (primeraVez && S.hist[pr] && S.hist[pr].rondas.length) S.abiertos.add(`hist:${pr}:${S.hist[pr].rondas[0].fila ?? 0}`);
  if (String(S.cajon) === String(id)) pintar();
}

  const tono = x.estado === "v3_analizado" ? (freno ? "bad" : "ok") : "";

  const loc = (S.datos.locales || []).includes(String(x.pr));

        ${(r.faltan || []).map((f) => `<span class="mono" style="font-size:12px;color:var(--bad);padding-left:8px">${esc(f.ruta)}${f.lineas ? ` · ${esc(f.lineas)} línea(s)` : ""}${f.motivo ? ` · ${esc(f.motivo)}` : ""}</span>`).join("")}</div>`).join("")}
      ${x.reglas.ok ? "" : `<span style="font-size:13px;color:var(--bad)">No es aprobable así: puedes entregarlo, pero el aprobador lo ve marcado y decide.</span>`}
    </section>` : "";
  const esc3 = (d.funcional && d.funcional.escenarios) || [];
  const tipoChip = (t) => `<span class="chip ${t === "feliz" ? "c-ok" : t === "error" ? "c-bad" : "c-info"}">${esc(t)}</span>`;
  let panel = "";

      : (["v3", "corriendo", "pendiente"].includes(x.estado) && !x.entregado ? pasosAnalisis(x) : `<p style="color:var(--tenue);margin:0">Esperando el análisis…</p>`);
  } else if (S.dtab === "que") {

      <section class="caja"><span class="rot">A qué afecta</span><ul style="margin:0;padding-left:18px;line-height:1.6">${(d.funcional.afecta || []).map((a) => `<li>${esc(a)}</li>`).join("")}</ul></section></div>` : ""}
    ${esc3.length ? `<section style="display:flex;flex-direction:column;gap:8px"><span class="rot">Escenarios de prueba · pruébalo antes de enviar</span>
      <div style="border:1px solid var(--linea);border-radius:10px;overflow:auto;background:var(--caja)"><table><tr><th>Escenario</th><th>Tipo</th><th>Petición o cómo se prueba</th><th style="text-align:right">Espera</th></tr>
      ${esc3.map((e) => `<tr><td>${esc(e.nombre)}</td><td>${tipoChip(e.tipo)}</td><td>${e.metodo ? `<span class="mono">${esc(e.metodo)} ${esc(e.ruta)}</span>` : ""}${e.precondicion ? `<div style="color:var(--suave)">${esc(e.precondicion)}</div>` : ""}</td><td class="mono" style="text-align:right">${esc(e.espera_status || "—")}</td></tr>`).join("")}</table></div></section>` : ""}
    ${(d.preguntas || []).length ? `<section class="caja" style="background:var(--warn-f);border-color:var(--warn)"><span class="rot" style="color:var(--warn)">Preguntas para confirmar</span><ul style="margin:0;padding-left:18px;line-height:1.6;color:var(--warn)">${d.preguntas.map((q) => `<li>${esc(q)}</li>`).join("")}</ul></section>` : ""}
    ${x.final ? `<details><summary class="rot" style="cursor:pointer">Análisis completo</summary><pre>${esc(x.final)}</pre></details>` : ""}`;
    if (!d.funcional && !esc3.length && !(d.preguntas || []).length && !x.final) panel = `<p class="vacio">El análisis todavía no trae esta parte.</p>`;

  } else if (S.dtab === "desp") {
    panel = `${d.despliegue ? `<section class="caja"><span class="rot">Orden de despliegue</span><p style="margin:0;line-height:1.6">${esc(d.despliegue)}</p></section>` : ""}
      ${x.reglas && x.reglas.ok ? reglasRamas : ""}
      ${costo.modelo || costo.proveedor ? `<section class="caja"><span class="rot">Motor del análisis</span><span>${esc([costo.proveedor, costo.modelo].filter(Boolean).join(" · "))}</span></section>` : ""}`;
    if (!panel.trim()) panel = `<p class="vacio">El análisis no trae indicaciones de despliegue.</p>`;
  } else if (S.dtab === "hist") {

  const ronda = x.ronda ? ` · ronda ${esc(x.ronda.numero || 2)}` : "";
  return `<div class="velo" data-cerrar aria-hidden="true"></div>

      </div>
      <div class="panel-d" role="tabpanel" id="panel-d" aria-labelledby="tab-d-${S.dtab}">${panel}</div>
    </div>
  </aside>`;
}

function pasosConfig() {
  const e = S.datos ? S.datos.estado || {} : {}, pr = e.pruebas || {};
  const ro = pr.repos_ok || { ok: !!e.repos, error: "" };
  const us = pr.usuarios || [], comp = us.filter((u) => u.compartido), propios = us.length - comp.length;
  return [
    ["Carpeta de repos", !!e.repos && ro.ok !== false, !e.repos ? "falta" : ro.error ? ro.error : e.repos],
    ["Jira", !!e.jira, e.jira ? `${e.jira_email || ""} · token probado` : "falta"],
    ["Base de datos ci", !!pr.bd, pr.bd ? "conectada" : "falta"],
    ["Usuarios de prueba ci", (pr.empresas || 0) >= 2, comp.length ? `precargados por el revisor · ${comp.length} + ${propios} propio(s) · ${pr.empresas || 0} empresa(s)` : `${us.length} usuario(s) · ${pr.empresas || 0} empresa(s)`],
    ["Backoffice ci", !!pr.bo, pr.bo_config ? "leído de ms-config-properties (master)" : pr.bo_leyendo ? "leyendo ms-config-properties…" : pr.bo ? "llaves propias probadas" : (pr.bo_error || "falta")],
  ];
}

function vistaPorAprobar() {
  const pa = S.datos.por_aprobar || {}, prs = pa.prs || [];
  const tono = { listo: "c-ok", hodor: "c-ok", observaciones: "c-nar", sin_revision: "c-bad", fuera_dev: "c-bad", release: "c-warn", release_reemplazo: "c-info" };
  const rotulo = { listo: "Pasó el worker", hodor: "Hodor lo aprobó", observaciones: "Con observaciones", sin_revision: "Sin revisión del worker", fuera_dev: "Código fuera de development", release: "Falta tu visto bueno", release_reemplazo: "Reemplazo posible" };
  const fila = (x) => {
    const s = x.situacion || {}, w = s.worker || {};
    const nom = (c) => String(c || "").split("@")[0].split(".").slice(0, 2).map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
    const detalle = [w.puntaje != null ? `${w.puntaje}/100` : "", w.sello ? "sello válido" : "", s.codigo && s.codigo.aplica ? (s.codigo.ok ? "código en development" : s.codigo.sabido ? "código fuera de development" : "comparando con development…") : ""].filter(Boolean).join(" · ");
    return `<div class="det">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0;flex:999 1 420px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>${esc(x.repo)}</b><span class="mono" style="color:var(--tenue)">#${esc(x.pr)}</span><span class="chip c-info">${esc(x.destino)}</span><span class="chip ${tono[s.clave] || "c-off"}">${esc(rotulo[s.clave] || s.clave || "—")}</span>${x.aprobado_por_mi ? `<span class="chip c-ok">${I_OK} ya lo aprobaste</span>` : ""}</div>
        <span style="color:var(--suave);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.historia || "")}${x.historia ? " · " : ""}${esc(x.titulo || "")} · de ${esc(nom(x.autor))}</span>
        <span style="font-size:12.5px;color:var(--tenue)">${esc(s.texto || "")}${detalle ? ` · ${esc(detalle)}` : ""}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${w.fila ? `<button class="btn fant" data-par="${esc(w.fila)}">Ver análisis</button>` : ""}
        ${externo(x.url, "Abrir en CodeCommit", `btn ${s.clave === "listo" || s.clave === "release" || s.clave === "release_reemplazo" ? "prim" : "fant"}`)}
      </div>
    </div>`;
  };
  const pendientes = prs.filter((x) => !x.aprobado_por_mi), hechos = prs.filter((x) => x.aprobado_por_mi);
  return `<div class="titulo-pag"><div style="flex-grow:1"><h1>Por aprobar</h1><p>PRs de otros en tus repos (${esc((pa.repos || []).join(", "))}) que puedes aprobar. Antes de aprobar mira si pasaron por el worker de su autor${S.datos.sin_dev ? "" : " y, en master, si todo su código ya está en development"}. Aprobar es tu decisión: esto no bloquea, pero cada aprobación queda registrada con lo que el PR traía en ese momento. Si aprobaste ${S.datos.sin_dev ? "master" : "development o master"} de una historia, también te toca el visto bueno del release.</p></div></div>
    ${pendientes.length ? `<section class="grupo">${pendientes.map(fila).join("")}</section>` : `<p class="vacio">No hay PRs esperando tu aprobación.</p>`}
    ${hechos.length ? `<details class="grupo"><summary style="cursor:pointer;padding:12px 18px;color:var(--suave)">Ya los aprobaste · ${hechos.length}</summary>${hechos.map(fila).join("")}</details>` : ""}`;
}

function cajonPar() {
  const x = S.par;
  if (!x) return "";
  const cab = (t) => `<header class="cajon-cab"><div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0">${t}</div><button class="icono" data-cerrar aria-label="Cerrar">${I_CERRAR}</button></header>`;
  if (x.cargando) return `<div class="velo" data-cerrar aria-hidden="true"></div><aside class="cajon" role="dialog" aria-modal="true" aria-label="Análisis">${cab("")}<p class="vacio">Cargando el análisis…</p></aside>`;
  if (x.error) return `<div class="velo" data-cerrar aria-hidden="true"></div><aside class="cajon" role="dialog" aria-modal="true" aria-label="Análisis">${cab("")}<div class="cajon-cuerpo"><div class="aviso c-bad">${esc(x.error)}</div></div></aside>`;
  const hall = (x.hallazgos || []).filter((h) => !h._retirado);

    <div class="cajon-cuerpo">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ${x.freno ? "c-bad" : "c-ok"}">${x.freno ? `No se puede entregar: ${esc(x.freno)}` : "Nada que bloquee"}</span><span class="chip c-info mono">${esc(x.puntaje ?? "—")}/100</span>${x.sello ? `<span class="chip c-ok">sello válido</span>` : ""}<span class="chip ${x.entregado ? "c-ok" : "c-warn"}">${x.entregado ? "entregado" : "sin entregar"}</span></div>
      ${x.resumen ? `<p style="margin:0;color:var(--suave);line-height:1.6">${esc(x.resumen)}</p>` : ""}
      <span class="rot">Hallazgos · ${hall.length}</span>

    </div>
  </aside>`;
}

      <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:15px">Usa las mismas reglas en tu Claude</b>${estadoSkill}</div>
        <p style="margin:0;color:var(--suave)">La skill <span class="mono">g66-lineamientos</span> queda en <span class="mono">${esc((sk && sk.ruta) || "~/.claude/skills/")}</span>. Claude Code la carga sola cuando escribes Java en un ms-*.${sk ? " El worker puede actualizarla cada vez que cambian las reglas o el ai-context de tu clon." : ""}</p>
        ${sk ? `<div style="display:flex;align-items:center;gap:10px"><button class="interruptor" role="switch" id="skill-auto" aria-checked="${!!sk.auto}" data-accion="skill-auto" ${vista ? "disabled" : ""}><span class="sr">Mantenerla actualizada automáticamente</span></button><label for="skill-auto" style="cursor:pointer">Mantenerla actualizada automáticamente</label></div>` : ""}

        <button class="btn" data-accion="exportar-reglas">Exportar para Cursor u otra IA</button>

            <button class="filtro" aria-pressed="${!S.temaRegla}" data-tema-regla="">Todas <span class="mono">${reglas.length}</span></button>
            ${Object.entries(temas).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<button class="filtro" aria-pressed="${S.temaRegla === t}" data-tema-regla="${esc(t)}">${esc(t)} <span class="mono">${n}</span></button>`).join("")}

function pintar() {
  const app = document.getElementById("app");
  const act = document.activeElement;
  const foco = act && act.dataset && act.dataset.foco ? { k: act.dataset.foco, ini: act.selectionStart, fin: act.selectionEnd } : null;
  if (!S.datos) { app.innerHTML = `<p class="vacio" role="status">Cargando…</p>`; return; }
  if (S.datos.error) { app.innerHTML = `<div class="app">${lado()}<div class="contenido">${franjas()}<main class="pagina"><div class="aviso c-bad">${esc(S.datos.error)}</div></main></div></div>${S.config ? vistaConfig() : ""}`; return; }
  const d = S.datos;
  if (S.tab === "apr" && !(d.por_aprobar || {}).aprobador) S.tab = "mis";
  if (S.tab === "reglas" && !S.reglas) S.tab = "mis";
  const vistas = { analizar: vistaAnalizar, mis: vistaMis, apr: vistaPorAprobar, reglas: vistaReglas, sug: vistaSugerencias, ajustes: vistaAjustes };
  app.innerHTML = `<div class="app">${lado()}<div class="contenido">${franjas()}
      <main class="pagina ${S.tab === "analizar" ? "hero" : ""}" id="principal">${(vistas[S.tab] || vistaMis)()}</main>
    </div></div>
    ${S.cajon ? cajon() : ""}
    ${S.par ? cajonPar() : ""}
    ${S.motivo ? cajonMotivo() : ""}
    ${S.config ? vistaConfig() : ""}
    ${S.ayuda ? vistaAyuda() : ""}`;
  const ruta = RUTAS[S.tab] || "/";
  if (location.pathname !== ruta) history[pintar.inicial ? "replaceState" : "pushState"]({ tab: S.tab }, "", ruta);
  pintar.inicial = false;
  if (foco) { const b = app.querySelector(`[data-foco="${foco.k}"]`); if (b) { b.focus(); try { b.setSelectionRange(foco.ini, foco.fin); } catch { /* sin selección */ } } }
}

async function cargar(partes) {
  try {
    const nuevo = await api(partes ? `/api/datos?partes=${partes}` : "/api/datos");
    S.datos = partes && S.datos && !S.datos.error && !nuevo.error ? { ...S.datos, ...nuevo } : nuevo;
    if (!partes && !nuevo.error) S.cargadoEn = Date.now();
  } catch { S.datos = { error: "no pude hablar con tu worker" }; }
  if (S.datos && S.datos.estado && !S.datos.estado.configurado && !cargar.mostrado) { S.config = true; cargar.mostrado = true; }
  pintar();
}
async function cargarConexion() { const c = await opcional("/api/conexion"); S.conexion = c && typeof c.conectado === "boolean" ? c : null; }
async function cargarReglas() { let r = null; try { r = await api("/api/reglas"); } catch { /* sin endpoint */ } S.reglas = r && !r.error && (Array.isArray(r.reglas) || r.skill) ? r : null; }

function numeroPr(x) { const s = String(x || ""); const m = s.match(/pull-requests\/(\d+)/) || s.match(/^#?(\d+)$/); return m ? m[1] : s; }
function repoDe(url) { const m = String(url || "").match(/repositories\/([^/?#]+)/); return m ? decodeURIComponent(m[1]) : ""; }
async function pedir(url) {
  if (verComo()) return aviso(`Estás viendo como ${nombreDev(verComo())}: solo lectura`, "bad");
  if (!String(url || "").trim()) return aviso("Pega el link del PR.");
  if (S.pidiendo) return;
  S.pidiendo = true; S.url = url; pintar();
  aviso("Pidiendo el análisis a Hodor…");
  let r;
  try { r = await api("/api/pedir", { url }); } catch { r = { error: "No pude hablar con tu worker." }; }
  S.pidiendo = false;
  if (r.error) { pintar(); return aviso(r.error, "bad"); }
  aviso(`Pedido #${r.pr} enviado: Hodor lo valida.`, "ok");
  S.pedido = { pr: String(r.pr), repo: r.repo || repoDe(url), en: ahora() };
  S.url = ""; S.tab = "mis"; S.cajon = null; S.filtroHu = "pendientes"; S.busca = "";
  cargar();
}

async function descargar(nombreArchivo, texto) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], { type: "text/markdown" })); a.download = nombreArchivo; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
