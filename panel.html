    return cargarCajon(id);
  }
  if ((el = t("[data-plan-otra]"))) { const r = await api("/api/plan/otra-vez", { fila: el.dataset.planOtra }); aviso(r.error || "Va otra vez: mismos escenarios.", r.error ? "bad" : "ok"); await cargar(); return cargarCajon(el.dataset.planOtra); }
  if ((el = t("[data-ir-historia]"))) { return irAHistoria(el.dataset.irHistoria); }
  if ((el = t("[data-motivo]"))) { S.motivo = el.dataset.motivo; return pintar(); }
  if ((el = t("[data-cerrar]"))) { S.cajon = null; S.par = null; S.motivo = ""; return pintar(); }
  if ((el = t("[data-par]"))) {
    S.par = { cargando: true }; pintar();
    try { S.par = await (await fetch(`/api/analisis-par/${encodeURIComponent(el.dataset.par)}`, { headers: { "X-Panel": CLAVE } })).json(); } catch { S.par = { error: "no pude traer el análisis" }; }
    return pintar();
  }
  if ((el = t("[data-pedir]"))) return pedir(el.dataset.pedir);
  if ((el = t("[data-ocultar]"))) { await api("/api/ocultar", { pr: el.dataset.ocultar, tipo: el.dataset.tipo }); S.verIgnorados = !el.dataset.tipo; return cargar(); }
  if ((el = t("[data-tiposug]"))) { S.tipoSug = el.dataset.tiposug; return pintar(); }
  if ((el = t("[data-terminal]"))) { const r = await api("/api/terminal", { pr: el.dataset.terminal, repo: el.dataset.repo, rama: el.dataset.rama }); return aviso(r.error || `Abrí una terminal en ${r.carpeta}`, r.error ? "bad" : "ok"); }
  if ((el = t("[data-enviar]"))) {
    if (!confirm("¿Enviar este PR a Hodor? Pasa por las reglas de siempre y le llega al revisor con tu análisis.")) return;
    const r = await api("/api/enviar", { id: el.dataset.enviar }); aviso(r.error || "Enviado. Hodor lo toma desde aquí.", r.error ? "bad" : "ok"); return cargar();
  }
  if ((el = t("[data-probar]"))) {
    const k = el.dataset.probar; S.prueba[k] = "probando"; pintar();
    let r;
    try { r = await api("/api/proveedor/probar", { proveedor: k }); } catch { r = { error: "no pude probarlo" }; }
    S.prueba[k] = r && !r.error && r.listo ? { ok: true, texto: `Conectado${r.version ? ` · ${r.version}` : ""}.` } : { ok: false, texto: (r && (r.error || r.detalle)) || (r && r.instalado ? "Instalado, pero sin sesión." : "No respondió.") };
    await cargarModelos(); return pintar();
  }
  if ((el = t("[data-accion]"))) {
    const a = el.dataset.accion;
    if (a === "actualizar") {
      aviso("Buscando una versión nueva…");
      const r = await api("/api/actualizar", {});
      if (r.error) return aviso(r.error, "bad");
      if (!r.nueva) return aviso(`Ya tienes la última versión (${(r.version || "").replace("v3-worker ", "")}).`);
      aviso("Hay versión nueva: la instalé y el worker se reinicia. La página se recarga sola.");
      return setTimeout(() => location.reload(), 6000);
    }
    if (a === "tema") { const i = TEMAS.findIndex((x) => x[0] === S.tema); aplicarTema(TEMAS[(i + 1) % TEMAS.length][0]); aviso(`Tema: ${TEMAS.find((x) => x[0] === S.tema)[1].toLowerCase()}.`); return pintar(); }
    if (a === "volver-a-mi") return elegirVerComo("");
    if (a === "recargar") { aviso("Actualizando…"); await Promise.all([cargar(), cargarConexion()]); aviso("Al día.", "ok"); return; }
    if (a === "cerrar-pedido" && S.pedido) { for (const p of S.datos.pedidos || []) if (numeroPr(p.pr) === numeroPr(S.pedido.pr)) S.quitados.add(`pedido:${p.pr}:${p.en}`); }
    if (a === "cerrar-pedido") { S.pedido = null; return pintar(); }
    if (a === "ver-fijos") { S.verFijos = !S.verFijos; return pintar(); }
    if (a === "config") { S.config = true; S.paso = 1; return pintar(); }
    if (a === "cerrar-config") { S.config = false; return pintar(); }
    if (a === "ayuda-cerrar") { S.ayuda = null; return pintar(); }
    if (a === "ayuda-enviar") return enviarAyuda();
    if (a === "skill-instalar") {
      aviso("Instalando la skill…");
      let r; try { r = await api("/api/reglas/skill", { accion: "instalar" }); } catch { r = { error: "no pude hablar con tu worker" }; }
      aviso(r.error ? `No pude instalar la skill: ${r.error}` : "Skill instalada en Claude Code.", r.error ? "bad" : "ok"); await cargarReglas(); return pintar();
    }
    if (a === "skill-auto") {
      const auto = el.getAttribute("aria-checked") !== "true";
      const r = await opcional("/api/reglas/skill", { accion: "auto", auto });
      aviso(r ? (auto ? "La skill se actualiza sola cuando cambian las reglas." : "La skill ya no se actualiza sola.") : "No pude cambiarlo."); await cargarReglas(); return pintar();
    }
    if (a === "claude-md") {
      const r = await textoDe("/api/reglas/claude-md");
      if (!r) return aviso("No pude armar el CLAUDE.md.");
      try { await navigator.clipboard.writeText(r.texto); aviso("Copiado: pégalo como CLAUDE.md en la raíz del repo."); } catch { descargar(r.nombre || "CLAUDE.md", r.texto); aviso("No pude copiar: lo descargué como CLAUDE.md."); }
      return;
    }
    if (a === "exportar-reglas") {
      const r = await textoDe("/api/reglas/exportar");
      if (!r) return aviso("No pude exportar las reglas.");
      return descargar(r.nombre || "lineamientos-g66.md", r.texto);
    }
    if (a === "paso-repos") {
      const v = document.getElementById("c-repos").value.trim();
      if (v) {
        const r = await api("/api/config", { repos: v });
        if (r.error) return aviso(r.error, "bad");
        const ro = (r.pruebas || {}).repos_ok || {};
        if (ro.error) { aviso(ro.error, "bad"); return cargar(); }
      }
      S.paso = 2; return cargar();
    }
    if (a === "paso-jira") {
      const mail = (document.getElementById("c-jmail") || { value: "" }).value.trim(), tok = document.getElementById("c-jtok").value.trim();
      const r = await api("/api/config", { ...(mail ? { jira_email: mail } : {}), ...(tok ? { jira_token: tok } : {}), terminar: true });
      if (r.error) return aviso(`Jira: ${r.error}`);
      aviso("Jira conectado."); S.paso = 3; return cargar();
    }
    if (a === "paso-bd") {
      const v = (id) => document.getElementById(id).value.trim();
      aviso("Probando la conexión…");
      const r = await api("/api/config/bd", { host: v("c-bhost"), puerto: v("c-bpuerto"), usuario: v("c-busr"), password: document.getElementById("c-bpass").value });
      if (r.error) return aviso(`BD: ${r.error}`);
      aviso(r.escritura ? "Conectó. Tu usuario también puede escribir, pero el plan solo lo usa para leer." : "Conectó · SELECT 1."); S.paso = 4; return cargar();
    }
    if (a === "otro-usuario") {
      const filas = [...document.querySelectorAll("[data-fila-usuario]")].map((f, i) => [document.getElementById(`c-uemail-${i}`).value, document.getElementById(`c-upass-${i}`).value]);
      S.filasUsuario = filas.length + 1; pintar();
      filas.forEach(([m, p], i) => { document.getElementById(`c-uemail-${i}`).value = m; document.getElementById(`c-upass-${i}`).value = p; });
      const nuevo = document.getElementById(`c-uemail-${filas.length}`); if (nuevo) nuevo.focus();
      return;
    }
    if (a === "paso-usuario") {
      const filas = [...document.querySelectorAll("[data-fila-usuario]")].map((f, i) => ({ email: document.getElementById(`c-uemail-${i}`).value.trim(), password: document.getElementById(`c-upass-${i}`).value })).filter((x) => x.email || x.password);
      if (!filas.length) return aviso("Escribe el correo y la contraseña de al menos un usuario.", "bad");
      const malos = [];
      let buenos = 0;
      for (const [i, f] of filas.entries()) {
        aviso(filas.length > 1 ? `Entrando con ${f.email} (${i + 1} de ${filas.length})…` : `Entrando con ${f.email}…`);
        const r = await api("/api/config/usuario", f);
        if (r.error) malos.push({ ...f, error: r.error });
        else { buenos += 1; aviso(`${f.email} entró: ${r.empresa || "sin empresa"}${r.nivel ? ` · nivel ${r.nivel}` : ""}.`, "ok"); }
      }
      S.filasUsuario = Math.max(1, malos.length);
      await cargar();
      malos.forEach((m, i) => { const e = document.getElementById(`c-uemail-${i}`), p = document.getElementById(`c-upass-${i}`); if (e) e.value = m.email; if (p) p.value = m.password; });
      if (malos.length) aviso(malos.map((m) => `${m.email}: ${m.error}`).join(" · "), "bad");
      else if (buenos > 1) aviso(`Agregué ${buenos} usuarios.`, "ok");
      return;
    }
    if (a === "paso-bo") {
      aviso("Leyendo ms-config-properties…");
      const r = await api("/api/config/bo/leer", {});
      if (r.error) { aviso(`Backoffice: ${r.error}`); return cargar(); }
      aviso("Llaves de backoffice leídas de ms-config-properties (master)."); return cargar();
    }
    if (a === "sugerir") {
      const texto = document.getElementById("sug").value.trim();
      if (texto.length < 5) return aviso("Escribe un poco más.");
      const r = await api("/api/sugerencia", { texto, tipo: S.tipoSug });
      aviso(r.error || "Gracias. Le llegó al revisor.", r.error ? "bad" : "ok"); if (!r.error) { S.sug = ""; return cargar(); } return;
    }
  }
});

S.tab = tabDeRuta();
pintar.inicial = true;
window.addEventListener("popstate", () => { S.tab = tabDeRuta(); S.cajon = null; S.motivo = ""; pintar(); });
S.tema = leerTema();
aplicarTema(S.tema);
Promise.all([cargarConexion(), cargarReglas(), cargarModelos(), cargarAdmin()]).then(pintar);
cargar();
setInterval(() => { document.querySelectorAll("[data-reloj]").forEach((n) => { n.textContent = reloj(n.dataset.reloj); }); }, 1000);
setInterval(() => {
  if (!S.cajon || S.pensando || document.hidden) return;
  const est = (S.plan[S.cajon] || {}).estado;
  if (["pendiente", "armando", "listo", "ejecutando", "evaluando", "dictando", "corrigiendo"].includes(est)) cargarCajon(S.cajon);
}, 5000);
const ocupado = () => S.cajon || S.config || S.menu || S.ayuda || (document.activeElement && document.activeElement.matches("textarea,input,select"));
setInterval(() => { if (!document.hidden && !ocupado() && hayEnCurso()) cargar("mis"); }, 5000);
setInterval(() => { if (!document.hidden && !ocupado() && !hayEnCurso()) cargar("mis"); }, 5 * 60 * 1000);
setInterval(async () => {
  const pr = S.datos && S.datos.estado ? S.datos.estado.pruebas || {} : {};
  if (document.hidden || !S.config || !pr.bo_leyendo || (document.activeElement && document.activeElement.matches("textarea,input,select"))) return;
  try { const e = await api("/api/estado"); if (e && !e.error) { S.datos.estado = e; pintar(); } } catch { /* worker caído */ }
}, 2000);
setInterval(async () => { if (document.hidden || S.conexion === null) return; const antes = JSON.stringify(S.conexion); await cargarConexion(); if (JSON.stringify(S.conexion) !== antes && !ocupado()) pintar(); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !ocupado() && Date.now() - (S.cargadoEn || 0) > 2 * 60 * 1000) cargar(); });
</script>
</body>
</html>
